<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Субсидия · Тренажёр господдержки</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Golos Text', sans-serif;
      background: #f7f7f7;
      color: #1A1A18;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .app-shell {
      width: 100%;
      max-width: 1300px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(26,26,24,0.2);
      transition: all 0.25s;
    }
    .dot.active { background: #1A1A18; transform: scale(1.2); }
    .dot.correct { background: #2D9E65; }
    .dot.wrong { background: #E24B4A; }

    .counter {
      font-size: 13px;
      color: #9B9B94;
      margin-left: 4px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border: 0.5px solid rgba(26,26,24,0.12);
      border-radius: 12px;
      padding: 1.5rem 1.25rem;
    }

    .dossier-card {
      height: fit-content;
    }

    .doc-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9B9B94;
      margin-bottom: 12px;
    }

    .company-name {
      font-family: 'Golos Text', sans-serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 24px;
      color: #1A1A18;
    }

    .param-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    .param-label {
      color: #6B6B66;
      font-weight: 400;
      min-width: 130px;
    }

    .param-value {
      color: #1A1A18;
      font-weight: 500;
      text-align: right;
    }

    .nuance-block {
      margin-top: 20px;
      padding: 14px 16px;
      background: #fafafa;
      border-radius: 8px;
      font-size: 14px;
      color: #4a5c5e;
      border-left: 3px solid #9B9B94;
    }

    .programs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 550px) {
      .programs-grid { grid-template-columns: 1fr; }
    }

    .program-card {
      background: #fff;
      border: 0.5px solid rgba(26,26,24,0.12);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      transition: opacity 0.2s, background 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .program-card.outcast {
      opacity: 0.6;
      background: #f3f3f3;
      border-color: rgba(26,26,24,0.08);
    }

    .stamp {
      position: absolute;
      top: 12px;
      right: -6px;
      transform: rotate(10deg);
      background: #9B9B94;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 16px;
      letter-spacing: 2px;
      border: 1px dashed #d0d0ca;
      border-radius: 30px;
      opacity: 0.9;
      z-index: 5;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: background 0.15s;
    }

    .stamp:hover {
      background: #7a7a73;
    }

    .program-title {
      font-weight: 600;
      font-size: 1.3rem;
      color: #1A1A18;
      margin-bottom: 8px;
      padding-right: 50px;
    }

    .program-amount {
      font-weight: 600;
      font-size: 1.5rem;
      color: #16a8a5;
      margin-bottom: 12px;
    }

    .program-desc {
      font-size: 0.9rem;
      color: #3e4a52;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .program-criteria {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      background: #f9f9f9;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .criteria-row {
      display: flex;
      justify-content: space-between;
    }

    .criteria-label {
      color: #6B6B66;
    }

    .criteria-value {
      font-weight: 500;
      color: #1A1A18;
    }

    .program-deadline {
      font-size: 0.8rem;
      color: #6B6B66;
      margin-bottom: 18px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn {
      border: none;
      background: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: 'Golos Text', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      text-align: center;
      border: 0.5px solid transparent;
    }

    .btn-outline-red {
      border: 0.5px solid #cb7a79;
      color: #ba4745;
      background: transparent;
    }

    .btn-outline-red:hover {
      background: #FDECEA;
    }

    .btn-filled-blue {
      background: #16a8a5;
      color: white;
      border: none;
    }

    .btn-filled-blue:hover {
      background: #16a8a5;
    }

    .program-card.outcast .btn-filled-blue {
      opacity: 0.5;
      pointer-events: none;
    }

    .program-card.outcast .btn-outline-red {
      pointer-events: auto;
      opacity: 1;
    }

    .extra-actions {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .btn-search-more {
      background: #fff;
      border: 0.5px solid rgba(26,26,24,0.25);
      color: #1A1A18;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-search-more:hover {
      background: #f0f0f0;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(26,26,24,0.3);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
    }

    .feedback-modal {
      background: #fff;
      max-width: 460px;
      width: 90%;
      border-radius: 16px;
      padding: 32px 28px;
      border: 0.5px solid rgba(26,26,24,0.12);
      text-align: center;
      box-shadow: 0 20px 35px -8px rgba(0,0,0,0.1);
    }

    .feedback-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }

    .feedback-message {
      font-family: 'Golos Text', sans-serif;
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 16px;
      color: #1A1A18;
    }

    .feedback-detail {
      color: #3e4a52;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .modal-btn {
      background: #1A1A18;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }

    .result-screen {
      text-align: center;
      padding: 2.5rem 2rem;
      background: #fff;
      border-radius: 16px;
      border: 0.5px solid rgba(26,26,24,0.12);
    }

    .result-score {
      font-family: 'Spectral', serif;
      font-size: 64px;
      font-weight: 500;
      margin: 20px 0 10px;
    }

    .result-message {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #1A1A18;
    }

    .restart-btn {
      background: #fff;
      border: 0.5px solid rgba(26,26,24,0.25);
      padding: 14px 28px;
      border-radius: 8px;
      font-family: 'Golos Text', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      margin: 8px;
      transition: background 0.15s;
      display: inline-block;
    }

    .restart-btn:hover {
      background: #f0f0f0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="progress-row">
    <div class="dots" id="progressDots"></div>
    <span class="counter" id="progressCounter">1/3</span>
  </div>

  <div id="gameScreen">
    <div class="layout">
      <div class="card dossier-card" id="dossierCard"></div>
      <div style="display: flex; flex-direction: column;">
        <div class="programs-grid" id="programsGrid"></div>
        <div class="extra-actions" id="extraActions"></div>
      </div>
    </div>
  </div>

  <div id="resultScreen" class="result-screen hidden"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="feedback-modal">
      <div class="feedback-icon" id="modalIcon">📋</div>
      <div class="feedback-message" id="modalTitle">Результат</div>
      <div class="feedback-detail" id="modalText"></div>
      <button class="modal-btn" id="modalContinueBtn">Продолжить</button>
    </div>
  </div>
</div>

          { title: 'Техно-Лидер', amount: '4 млн ₽', criteria: { 'KPI': 'рост +40%', 'Софинансирование': '20%', 'Дедлайн': 'через 20 дней' }, feedback: '<b>Вы получили деньги, но пожертвовали сном и прибылью.</b> Субсидия покрыла покупку, но ради роста выручки на 40% вам пришлось работать в три смены и тратить всю маржу на агрессивный маркетинг.', optimal: false, warning: true },
          { title: 'Импортозамещение', amount: '4 млн ₽', criteria: { 'Оборудование': 'только РФ' ,'Софинансирование': '20%', 'Дедлайн': 'через 30 дней'}, feedback: '<b>Договор расторгнут, деньги потребовали вернуть.</b> Вы купили немецкое оборудование вместо российского, что признано нецелевым использованием средств при первой же проверке.', optimal: false },

          { title: 'Развитие МСП', amount: '4 млн ₽', criteria: { 'KPI': 'рост выручки +20%', 'Софинансирование': '50%' }, feedback: '<b>Отказ из-за недостатка софинансирования.</b> Программа требовала 4 млн ₽ (50%) собственных средств на счете, поэтому ваша заявка была отклонена до начала конкурса.', optimal: false }
        ],
        searchMoreFeedback: '<b>Вы не увидели выгоду в финансовом инструменте.</b> Программа «Пром-Лизинг» позволяла обойти все ограничения по импорту и учредителям, а ваш отказ затормозил модернизацию цеха минимум на один квартал.',
        searchMoreOptimal: false
      },
      {
        dossier: {
          fullName: 'Завод «Квант»',
          age: '7 лет',
          goal: 'Создание лаборатории (50 млн ₽)',
          ownMoney: '15 млн ₽',
          plan: 'Патент и выручка 200 млн через 2 года',
          nuance: 'Техническая просрочка по кредиту на 1 день'
        },
        programs: [
          { title: 'Мега-Грант', amount: '35 млн ₽',  criteria: { 'Просрочки': 'отсутствие 6 мес.', 'Софинансирование': '30%'}, feedback: '<b>Мгновенный отказ.</b> Ошибка в один день в кредитной истории стала стоп-фактором для получения бюджетных средств.', optimal: false },
          { title: 'ФРП', amount: 'займ под 1%',  criteria: { 'Особенность': 'льготный займ','Требование': 'банковская гарантия' }, feedback: '<b>Вы получили займ, но потеряли полгода.</b> Из-за просрочки банки долго отказывали в гарантии, и вам пришлось переплатить юристам за структурирование сделки.', optimal: false, warning: true },
          { title: 'Региональный инвест-проект', amount: 'налоговые льготы',  criteria: {'Особенность':'снижение налога на прибыль'}, feedback: '<b>Проблема ликвидности не решена.</b> Налоговые льготы помогут через год, но сегодня у вас нет денег, чтобы закупить оборудование и начать стройку.', optimal: false },
          { title: 'НИОКР-Субсидия', amount: '20 млн ₽',  criteria: {'Назначение':'возмещение зарплат учёным', 'Софинансирование': '10%' }, feedback: '<b>Отказ в компенсации из-за недофинансирования.</b> Вы не смогли подтвердить целевые расходы на полную сумму в 20 млн ₽ своими силами, поэтому право на получение 20 млн ₽ от государства так и не наступило. Проект остановлен.', optimal: false }
        ],
        searchMoreFeedback: '<b>Единственное верное решение, спасшее компанию от черного списка.</b> С текущей просрочкой любая попытка получить госсредства закончилась бы официальным отказом, который испортил бы ваш рейтинг для будущих заявок.',
        searchMoreOptimal: true
      }
    ];

    // ---------- СОСТОЯНИЕ ----------
    let currentLevel = 1;
    let levelIterations = iterationsLevel1;
    let currentIterIndex = 0;
    let score = 0;
    let outcastFlags = [false, false, false, false];
    let submissionDone = false;
    let iterationResults = [];

    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');
    const dossierCard = document.getElementById('dossierCard');
    const programsGrid = document.getElementById('programsGrid');
    const extraActions = document.getElementById('extraActions');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalContinueBtn = document.getElementById('modalContinueBtn');
    const progressDots = document.getElementById('progressDots');
    const progressCounter = document.getElementById('progressCounter');

    let nextActionAfterModal = null;

    function updateProgress() {
      const total = levelIterations.length;
      const current = currentIterIndex + 1;
      progressCounter.textContent = `${current}/${total}`;
      let dotsHtml = '';
      for (let i = 0; i < total; i++) {
        let cls = 'dot';
        if (i < currentIterIndex) {
          cls += iterationResults[i] ? ' correct' : ' wrong';
        } else if (i === currentIterIndex) {
          cls += ' active';
        }
        dotsHtml += `<span class="${cls}"></span>`;
      }
      progressDots.innerHTML = dotsHtml;
    }

    function hideModal() {
      modalOverlay.style.visibility = 'hidden';
    }

    function showModal(icon, title, detail, onContinue) {
      modalIcon.textContent = icon || '📋';
      modalTitle.textContent = title;
      modalText.innerHTML = detail;
      modalOverlay.style.visibility = 'visible';
      nextActionAfterModal = onContinue;
    }

    modalContinueBtn.onclick = function() {
      hideModal();
      if (nextActionAfterModal) {
        const action = nextActionAfterModal;
        nextActionAfterModal = null;
        action();
      }
    };

    function proceedAfterSubmission(wasOptimal) {
      iterationResults.push(wasOptimal);
      if (currentLevel === 1) {
        if (currentIterIndex + 1 < levelIterations.length) {
          currentIterIndex++;
          renderIteration();
        } else {
          showLevel1Result();
        }
      } else {
        if (currentIterIndex + 1 < levelIterations.length) {
          currentIterIndex++;
          renderIteration();
        } else {
          showFinalResult();
        }
      }
    }

    function handleApply(idx) {
      if (submissionDone) return;
      const prog = levelIterations[currentIterIndex].programs[idx];
      const isOptimal = prog.optimal;
      if (isOptimal) score++;
      submissionDone = true;
      let icon = prog.optimal ? '✅' : (prog.warning ? '⚠️' : '❌');
      showModal(icon, prog.title, prog.feedback, () => proceedAfterSubmission(isOptimal));
    }

    function handleSearchMore() {
  if (submissionDone) return;
  const iter = levelIterations[currentIterIndex];
  const isOptimal = iter.searchMoreOptimal;
  const isWarning = iter.searchMoreWarning || false;
  
  if (isOptimal) score++;
  
  let icon = '🔍';
  if (isOptimal) icon += '✅';
  else if (isWarning) icon += '⚠️';
  else icon += '❌';
  
  submissionDone = true;
  showModal(icon, 'Поискать другие программы', iter.searchMoreFeedback, () => proceedAfterSubmission(isOptimal));
}

    

   

    function checkAllOutcast() {
      const allOut = outcastFlags.every(v => v);
      if (allOut && !submissionDone) {
        extraActions.innerHTML = '<button class="btn-search-more" id="searchMoreBtn">🔎 Поискать еще</button>';
        document.getElementById('searchMoreBtn').addEventListener('click', handleSearchMore);
      } else {
        extraActions.innerHTML = '';
      }
    }

    function toggleOutcast(index) {
      if (submissionDone) return;
      outcastFlags[index] = !outcastFlags[index];
      renderPrograms();
      checkAllOutcast();
    }

    function renderPrograms() {
      const iter = levelIterations[currentIterIndex];
      let html = '';
      for (let i = 0; i < iter.programs.length; i++) {
        const p = iter.programs[i];
        const out = outcastFlags[i];
        const criteria = p.criteria || {};
        const criteriaKeys = Object.keys(criteria);
        let criteriaHtml = '';
        if (criteriaKeys.length) {
          criteriaHtml = '<div class="program-criteria">';
          for (let [key, val] of Object.entries(criteria)) {
            criteriaHtml += `<div class="criteria-row"><span class="criteria-label">${key}:</span><span class="criteria-value">${val}</span></div>`;
          }
          criteriaHtml += '</div>';
        }
        html += `
          <div class="program-card ${out ? 'outcast' : ''}" data-index="${i}">
            ${out ? `<div class="stamp" data-stamp-index="${i}">ОТСЕЯНО</div>` : ''}
            <div class="program-title">${p.title}</div>
            <div class="program-amount">${p.amount}</div>
            
            ${criteriaHtml}
            
            <div class="card-actions">
              <button class="btn btn-outline-red outcast-toggle-btn" data-index="${i}">${out ? 'Вернуть' : 'Отсеять'}</button>
              <button class="btn btn-filled-blue apply-btn" data-index="${i}" ${out ? 'disabled' : ''}>Подать заявку</button>
            </div>
          </div>
        `;
      }
      programsGrid.innerHTML = html;

      document.querySelectorAll('.outcast-toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.dataset.index;
          if (idx !== undefined) toggleOutcast(parseInt(idx));
        });
      });

      document.querySelectorAll('.stamp').forEach(stamp => {
        stamp.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = stamp.dataset.stampIndex;
          if (idx !== undefined) toggleOutcast(parseInt(idx));
        });
      });

      document.querySelectorAll('.apply-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (submissionDone) return;
          const idx = btn.dataset.index;
          if (idx !== undefined && !outcastFlags[parseInt(idx)]) {
            handleApply(parseInt(idx));
          }
        });
      });
    }

    function renderDossier() {
      const d = levelIterations[currentIterIndex].dossier;
      const nuanceHtml = d.nuance ? `<div class="nuance-block">⚠️ ${d.nuance}</div>` : '';
      dossierCard.innerHTML = `
        <div class="doc-label">ДОСЬЕ КОМПАНИИ</div>
        <div class="company-name">${d.fullName}</div>
        <div class="param-item"><span class="param-label">Возраст</span><span class="param-value">${d.age}</span></div>
        <div class="param-item"><span class="param-label">Цель</span><span class="param-value">${d.goal}</span></div>
        <div class="param-item"><span class="param-label">Баланс</span><span class="param-value">${d.ownMoney}</span></div>
        <div class="param-item"><span class="param-label">План</span><span class="param-value">${d.plan}</span></div>
        ${nuanceHtml}
      `;
    }

    function renderIteration() {
      outcastFlags = [false, false, false, false];
      submissionDone = false;
      extraActions.innerHTML = '';
      renderDossier();
      renderPrograms();
      updateProgress();
      gameScreen.classList.remove('hidden');
      resultScreen.classList.add('hidden');
    }

    function showLevel1Result() {
      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      let msg = '';
      let extraBtn = '';
      if (score === 3) {
        msg = 'Блестяще! Ты настоящий мастер в выборе субсидий. Ты видишь бизнес насквозь и не даешь цифрам себя обмануть. <b>Ты даже раскусил, что иногда правильный ответ — "поискать другие"!</b> Готов к экспертным кейсам?';
        extraBtn = '<button class="restart-btn" id="toLevel2Btn">🏆 3 дополнительных кейса</button>';
      } else if (score === 2) {
        msg = 'Хороший результат! Ты уже видишь основные ловушки и умеешь считать свои деньги. Еще немного внимания к "мелкому шрифту", и ты станешь гуру. <b>Кстати, иногда лучший выбор — отклонить все сомнительные предложения.</b>';
        extraBtn = '<button class="restart-btn" id="retryLevel1Btn">Повторить уровень</button>';
      } else {
        msg = 'Не волнуйся, это правда непросто! Тебе нужно чуть больше практики. Посмотри материалы и попробуй снова. <b>И помни: если ни один вариант не подходит — смело отсеивай всё!</b>';
        extraBtn = '<button class="restart-btn" id="retryLevel1Btn">Повторить уровень</button>';
      }
      resultScreen.innerHTML = `
        <h2 style="font-family:Spectral,serif;font-weight:500;">🏁 Уровень 1 завершён</h2>
        <div class="result-score">${score} / 3</div>
        <div class="result-message">${msg}</div>
        ${extraBtn}
      `;
      if (score === 3) {
        document.getElementById('toLevel2Btn').addEventListener('click', ()=>{
          currentLevel = 2;
          levelIterations = iterationsLevel2;
          currentIterIndex = 0;
          score = 0;
          iterationResults = [];
          renderIteration();
        });
      } else {
        document.getElementById('retryLevel1Btn').addEventListener('click', ()=>{
          currentLevel = 1;
          levelIterations = iterationsLevel1;
          currentIterIndex = 0;
          score = 0;
          iterationResults = [];
          renderIteration();
        });
      }
    }

    function showFinalResult() {
      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      let finalMsg = '';
      if (score === 3) finalMsg = 'Невероятно! Ты — акула господдержки. Ты видишь скрытых учредителей и технические просрочки сквозь стены. Ты готов к реальному оформлению документов.';
      else if (score >= 1) finalMsg = 'Ты хорошо справляешься, но детали всё еще ускользают. Помни: субсидия — это юридический документ. Одно слово "иностранный" или "просрочка" может перечеркнуть недели расчетов';
      else finalMsg = 'Уровень "Мастер" оказался суров. Не расстраивайся, на таких ошибках люди теряют миллионы в реальности, а ты потерял только игровые баллы. Перечитай раздел про отсекающие критерии и попробуй еще раз!';
      resultScreen.innerHTML = `
        <h2 style="font-family:Spectral;">🏆 Экспертный уровень</h2>
        <div class="result-score">${score} / 3</div>
        <div class="result-message">${finalMsg}</div>
        <button class="restart-btn" id="retryLevel2Btn">🔄 Повторить уровень</button>
        <button class="restart-btn" id="resetAllBtn">🔁 Начать сначала</button>
      `;
      document.getElementById('retryLevel2Btn').addEventListener('click', ()=>{
        currentLevel = 2;
        levelIterations = iterationsLevel2;
        currentIterIndex = 0;
        score = 0;
        iterationResults = [];
        renderIteration();
      });
      document.getElementById('resetAllBtn').addEventListener('click', ()=>{
        currentLevel = 1;
        levelIterations = iterationsLevel1;
        currentIterIndex = 0;
        score = 0;
        iterationResults = [];
        renderIteration();
      });
    }

    function init() {
      currentLevel = 1;
      levelIterations = iterationsLevel1;
      currentIterIndex = 0;
      score = 0;
      iterationResults = [];
      renderIteration();
    }

    init();

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        hideModal();
        nextActionAfterModal = null;
      }
    });
  })();
</script>
</body>
</html>
